<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>VOTReader has moved</title>
<link rel="canonical" href="https://votreader.github.io/app/">
<meta http-equiv="refresh" content="0; url=https://votreader.github.io/app/">
<script>
  // Forward to the new home, preserving any hash route. Every path under this
  // old repo (root via index.html, anything else via 404.html) lands here, so
  // no reachable 404 remains — all of /VOTReader-studio/* -> /app/.
  location.replace("https://votreader.github.io/app/" + location.hash);
</script>
<style>
  html,body{height:100%}
  body{margin:0;display:flex;align-items:center;justify-content:center;text-align:center;
       padding:1.5rem;background:#000;color:#e8e0c8;
       font-family:Georgia,"Times New Roman",serif;line-height:1.6}
  a{color:#b8860b;text-decoration:none}
  a:hover{text-decoration:underline}
</style>
</head>
<body>
  <p>
    VOTReader has moved to<br>
    <a href="https://votreader.github.io/app/">votreader.github.io/app/</a><br>
    Redirecting&hellip;
  </p>
</body>
</html>
